<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Turismo Costa Rica</title>
    <style>
        /* --- ESTILOS GENERALES --- */
        :root {
            /* Paleta Café y Gris (Minimalista/Tierra) */
            --primary: #5D4037;       /* Café intenso (Coffee) */
            --accent: #8D6E63;        /* Café suave */
            --bg-color: #F5F5F5;      /* Gris muy claro */
            --card-bg: #FFFFFF;       /* Blanco */
            --text-main: #3E2723;     /* Café muy oscuro casi negro */
            --text-sec: #757575;      /* Gris medio neutro */
            --border: #E0E0E0;        /* Borde gris suave */
            --shadow: 0 4px 6px -1px rgba(62, 39, 35, 0.08); /* Sombra sutil cálida */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            padding: 20px;
        }

        /* --- LAYOUT --- */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* --- IMAGEN CABECERA --- */
        .header-image {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 16px;
            margin-bottom: 30px;
            box-shadow: var(--shadow);
            /* Fallback color café */
            background-color: var(--primary);
            filter: grayscale(20%) sepia(10%); /* Filtro sutil para unificar tonos */
        }

        /* --- HEADER --- */
        header {
            text-align: center;
            margin-bottom: 30px;
            padding-top: 0;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 10px;
            letter-spacing: -0.05rem;
        }

        p.subtitle {
            color: var(--text-sec);
            font-size: 1.1rem;
            max-width: 700px;
            margin: 0 auto;
        }

        /* --- CONTENEDOR POWER BI --- */
        .dashboard-container {
            background: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            margin-bottom: 30px;
        }

        .dashboard-header {
            padding: 16px 24px;
            border-bottom: 1px solid var(--border);
            background: #FAFAFA; /* Gris casi blanco */
            font-weight: 600;
            color: var(--text-main);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-badge {
            font-size: 0.75rem;
            background: #EFEBE9; /* Fondo café muy claro */
            color: #5D4037;      /* Texto café */
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 600;
            border: 1px solid #D7CCC8;
        }

        /* Wrapper para mantener el aspecto 16:9 responsive */
        .iframe-wrapper {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
        }

        .iframe-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* --- FOOTER --- */
        footer {
            text-align: center;
            margin-top: auto;
            color: var(--text-sec);
            font-size: 0.9rem;
            border-top: 1px solid var(--border);
            padding-top: 20px;
            padding-bottom: 20px;
        }

        /* Adaptación móvil extra */
        @media (max-width: 600px) {
            h1 { font-size: 1.8rem; }
            .header-image { height: 160px; }
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- IMAGEN DECORATIVA -->
        <img 
            src="https://images.unsplash.com/photo-1518182170546-0766ce6fec56?ixlib=rb-4.0.3&auto=format&fit=crop&w=1200&q=80" 
            alt="Paisaje de Costa Rica" 
            class="header-image"
        >

        <!-- HEADER -->
        <header>
            <h1>Turismo en Costa Rica 🇨🇷</h1>
            <p class="subtitle">Análisis predictivo de afluencia turística y tendencias de viaje 2024-2025.</p>
        </header>

        <!-- POWER BI DASHBOARD -->
        <section class="dashboard-container">
            <div class="dashboard-header">
                <span>Mapa Interactivo de Visitantes</span>
                <span class="status-badge">Actualizado: Hoy</span>
            </div>
            <div class="iframe-wrapper">
                <!-- 
                   IMPORTANTE: 
                   Reemplaza este enlace (src) con el link público de tu propio Power BI 
                   (File > Embed Report > Publish to Web)
                -->
                <iframe title="Dashboard" width="1024" height="1060" src="https://app.powerbi.com/view?r=eyJrIjoiMmI5ZGQ1ODEtMTFjYy00N2NjLWJjNWMtYjI2Y2VjMmRmMWM3IiwidCI6IjUzMDZiNjkzLTk1MTAtNDViMC05ODIzLTAxZmUyMGEzODk0NyIsImMiOjZ9" frameborder="0" allowFullScreen="true"></iframe>
         </div>
        </section>

        <!-- FOOTER -->
        <footer>
            <p>© 2024 Analytics Costa Rica. Desarrollado para visualización de ML.</p>
        </footer>

    </div>

</body>
</html>
